<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lorekeeper Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#edf0e5;font-family:'DM Sans',Arial,sans-serif}.keeper{position:absolute;left:4vw;bottom:7vh;width:min(360px,75vw);display:flex;align-items:flex-end;gap:12px;opacity:.97;transition:opacity .4s}.character{position:relative;flex:0 0 94px;height:112px;filter:drop-shadow(0 8px 13px #0008);animation:bob 4s ease-in-out infinite}.ear{position:absolute;top:1px;width:27px;height:49px;border:1px solid #d5e9b2;border-radius:70% 70% 12% 12%;background:#a9c783}.ear.left{left:11px;transform:rotate(-21deg)}.ear.right{right:11px;transform:rotate(21deg)}.face{position:absolute;z-index:1;top:17px;left:2px;width:90px;height:79px;border:1px solid #e1efc15c;border-radius:48%;background:radial-gradient(ellipse at 40% 25%,#e6efcf,#bed796 58%,#849d64);box-shadow:inset 0 -8px 15px #596e423d}.eye{position:absolute;top:38px;width:6px;height:9px;border-radius:50%;background:#263328}.eye.one{left:25px}.eye.two{right:25px}.cheek{position:absolute;top:52px;width:13px;height:6px;border-radius:50%;background:#d68d80a6}.cheek.one{left:11px}.cheek.two{right:11px}.mouth{position:absolute;top:52px;left:42px;width:7px;height:6px;border-bottom:1.5px solid #45543a;border-radius:0 0 9px 9px}.scarf{position:absolute;z-index:2;top:88px;left:10px;width:73px;height:11px;border-radius:50%;background:#d08364}.scarf:after{content:'';position:absolute;right:12px;top:5px;width:13px;height:18px;background:#d08364;clip-path:polygon(0 0,100% 0,80% 100%)}.bubble{position:relative;max-width:245px;margin-bottom:18px;padding:11px 14px;border:1px solid #c8e3a155;border-radius:10px;background:#111811eF;box-shadow:0 5px 20px #0005;color:#f1f3e8;font-size:14px;line-height:1.45;opacity:0;transform:translateY(7px);transition:.25s}.bubble.show{opacity:1;transform:translateY(0)}.bubble:after{content:'';position:absolute;left:-6px;bottom:15px;width:10px;height:10px;transform:rotate(45deg);background:#111811;border-left:1px solid #c8e3a155;border-bottom:1px solid #c8e3a155}.brand{position:absolute;right:16px;bottom:13px;color:#d8e8c1a8;font:10px 'DM Mono',monospace;letter-spacing:1.5px;text-shadow:0 2px 5px #000}.keeper.hidden{opacity:0}.keeper.hidden .bubble{opacity:0}@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}.keeper.celebrate .character{animation:celebrate .45s ease-in-out 4}@keyframes celebrate{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) translateY(-8px)}75%{transform:rotate(9deg) translateY(-8px)}}
</style></head><body><div class="keeper hidden" id="keeper"><div class="character"><div class="ear left"></div><div class="ear right"></div><div class="face"><i class="eye one"></i><i class="eye two"></i><i class="cheek one"></i><i class="cheek two"></i><i class="mouth"></i></div><div class="scarf"></div></div><div class="bubble" id="bubble"></div></div><div class="brand">✳ &nbsp; LOREKEEPER</div><script>
const keeper=document.querySelector('#keeper'),bubble=document.querySelector('#bubble');let timer,muted=false;let lastSeq=Number(sessionStorage.getItem('lorekeeper-overlay-seq')||0);fetch('/api/state').then(r=>r.json()).then(s=>{muted=!!s.muted;if(muted)keeper.classList.add('hidden')}).catch(()=>{});const source=new EventSource('/api/stream?since='+lastSeq);source.onmessage=e=>{let data;try{data=JSON.parse(e.data)}catch{return}if(data.kind==='settings'){muted=!!data.muted;if(muted){clearTimeout(timer);bubble.classList.remove('show');keeper.classList.add('hidden')}return}if(data.kind!=='reaction'||!data.reaction||muted)return;const seq=Number(data.seq||data.reaction.seq||0);if(seq&&seq<=lastSeq)return;if(seq){lastSeq=seq;sessionStorage.setItem('lorekeeper-overlay-seq',String(seq))}const r=data.reaction;bubble.textContent=r.text;keeper.classList.remove('hidden','celebrate');if(r.animation==='celebrate')keeper.classList.add('celebrate');requestAnimationFrame(()=>bubble.classList.add('show'));clearTimeout(timer);timer=setTimeout(()=>{bubble.classList.remove('show');setTimeout(()=>keeper.classList.add('hidden'),300)},7500)};
</script></body></html>
